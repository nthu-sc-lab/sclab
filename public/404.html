<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>找不到頁面｜SCLAB</title>
    <style>
      :root {
        color: #14213d;
        background: #f4f7fb;
        font-family:
          Inter, "Noto Sans TC", system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }

      main {
        width: min(34rem, calc(100% - 3rem));
        padding: 3rem;
        border: 1px solid #dce4ef;
        border-radius: 1.25rem;
        background: #ffffff;
        box-shadow: 0 1.5rem 4rem rgb(20 33 61 / 10%);
        text-align: center;
      }

      p {
        color: #526174;
        line-height: 1.7;
      }

      a {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.75rem 1.25rem;
        border-radius: 999px;
        color: #ffffff;
        background: #174ea6;
        font-weight: 700;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 3px solid #f4b400;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p>404</p>
      <h1>找不到這個頁面</h1>
      <p>網址可能已變更，或頁面目前不存在。</p>
      <a href="/sclab/">返回 SCLAB 首頁</a>
    </main>
  </body>
</html>
